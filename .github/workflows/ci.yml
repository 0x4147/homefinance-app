name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides which parts of the repo changed. Downstream jobs always report a status
  # (skipped counts as passing), so they can all be required checks in branch protection.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            workflows:
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: ./mvnw -B test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  images:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Decide whether this image needs checking
        id: gate
        run: |
          if [ "${{ needs.changes.outputs[matrix.service] }}" = "true" ] || [ "${{ needs.changes.outputs.workflows }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'
      - name: Build image (not pushed)
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: homefinance-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Scan image with Trivy
        if: steps.gate.outputs.run == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: homefinance-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # TODO: make the backend scan blocking once Spring Boot is upgraded (3.3.3 has
          # fixable HIGH/CRITICAL CVEs). Until then it reports findings without failing the PR.
          exit-code: ${{ matrix.service == 'backend' && '0' || '1' }}
