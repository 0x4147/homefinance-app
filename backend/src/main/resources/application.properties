spring.application.name=homefinance
spring.data.mongodb.database=finance-api-db
spring.data.mongodb.uri=mongodb+srv://asankanz:nLGPApJ5QLMKLTji@cluster0.kqfad.mongodb.net/
server.port=8585

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway configs
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
# Disable auto hibernate auto creating tables
spring.jpa.hibernate.ddl-auto=none

# Hibernate JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG

# Enable logging for Spring Boot
logging.level.root=INFO
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR
logging.level.ca.homefinance=DEBUG
